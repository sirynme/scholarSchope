name: ScholarScope CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check (lint)
        run: npm run lint

      - name: Execute unit and integration tests
        run: ./node_modules/.bin/tsx --test src/lib/engines.test.ts

      - name: Build production bundle
        run: npm run build
